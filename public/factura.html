<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Factura</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header>
    <h1>Factura Generada</h1>
  </header>

  <main>
    <pre id="factura-text"></pre>
    <button onclick="window.history.back()">Volver</button>
  </main>

  <script>
    const factura = JSON.parse(localStorage.getItem("ultimaFactura"));
    document.getElementById("factura-text").innerText = factura.ticket || "No hay factura";
  </script>
</body>
</html>
